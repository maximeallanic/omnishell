name: Release

# A tag vX.Y.Z runs the tests, builds the source tarball and the extensions.gnome.org zip, and publishes a GitHub
# release whose notes are the tag's CHANGELOG section.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-latest
    container: debian:testing
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gnome-shell gettext gh
      - uses: actions/checkout@v4
      - name: The tag matches the version in the code
        shell: bash
        run: |
          version="${TAG#v}"
          grep -qx "GOOGLE_HUB_VERSION=$version" lib/common.sh || { echo "::error::lib/common.sh is not $version"; exit 1; }
          grep -qx "PINNED_RELEASE=$TAG" install.sh || { echo "::error::install.sh does not pin $TAG"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::no CHANGELOG section for $version"; exit 1; }
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p dist
          git archive --format=tar.gz --prefix="gnome-google-hub-${TAG#v}/" -o "dist/gnome-google-hub-${TAG#v}.tar.gz" HEAD
          scripts/pack.sh --out dist
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
      - name: Publish
        shell: bash
        run: |
          flags=()
          if [[ $TAG == v0.* || $TAG == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes-file notes.md "${flags[@]}"
