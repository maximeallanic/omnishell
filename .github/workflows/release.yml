name: Release

# A tag vX.Y.Z runs the tests, rebuilds the release tarball that the one-line installer downloads, checks that it
# matches the sha256 pinned in install.sh (scripts/release.sh writes that pin before the tag is made), builds the
# extensions.gnome.org zip, and publishes both with their sha256 and the tag's CHANGELOG section as notes.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: ci
    runs-on: ubuntu-latest
    container: debian:testing
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gnome-shell gettext gh
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the tarball and check it matches the pin in install.sh
        shell: bash
        run: scripts/release.sh --build-only "${TAG#v}"
      - name: Build the extensions.gnome.org zip
        shell: bash
        run: |
          scripts/pack.sh --out dist
          (cd dist && sha256sum omnishell@maximeallanic.github.io.shell-extension.zip \
              > omnishell@maximeallanic.github.io.shell-extension.zip.sha256)
      - name: Publish
        shell: bash
        run: |
          version="${TAG#v}"
          flags=()
          if [[ $TAG == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "dist/omnishell-$version.tar.gz" "dist/omnishell-$version.tar.gz.sha256" \
              dist/omnishell@maximeallanic.github.io.shell-extension.zip \
              dist/omnishell@maximeallanic.github.io.shell-extension.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file dist/notes.md "${flags[@]}"
